[workspace]
members = ["crates/converter-core", "crates/converter-cli", "crates/converter-download", "crates/converter-test-support", "crates/converter-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
adler2 = "2"
sha2 = "0.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
unicode-normalization = "0.1.26"
encoding_rs = "0.8.42"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
atomicwrites = "0.4.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal", "test-util", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
async-trait = "0.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "hooks"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
