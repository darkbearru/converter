name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      large_dictionary:
        description: Проверить миллион статей и измерить RSS
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.large_dictionary || false }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust • ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            extra: ''
          - os: windows-latest
            extra: ''
          - os: ubuntu-latest
            extra: '--exclude converter-desktop'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-checks-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets ${{ matrix.extra }}
      - run: cargo clippy --locked --workspace --all-targets ${{ matrix.extra }} -- -D warnings
      - name: Large dictionary and RSS
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.large_dictionary }}
        run: cargo test --locked --release -p converter-core --test large_dictionary -- --ignored --nocapture

  frontend:
    name: Vue • Chromium + WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run format:check
      - run: npm test -- --run
      - run: npm run check:contracts
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: frontend-failure-${{ github.sha }}
          path: .work/playwright-results/
          retention-days: 7
