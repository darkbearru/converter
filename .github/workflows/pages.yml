name: Product website

on:
  push:
    branches: [develop]
    paths:
      - 'website/**'
      - 'config/**'
      - 'scripts/pages/**'
      - 'tests/pages/**'
      - 'book.svg'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Test release selection and generated page
        run: node --test tests/pages/*.test.mjs
      - name: Read latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/converter-release.json"
      - name: Build public product page
        run: node scripts/pages/build.mjs --output .work/pages/site < "$RUNNER_TEMP/converter-release.json"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        with:
          path: .work/pages/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
