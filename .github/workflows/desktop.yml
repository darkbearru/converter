name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'locales/**'
      - 'config/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'package*.json'
      - 'vite.config.ts'
      - 'scripts/collect-packages.mjs'
      - 'scripts/build-*.mjs'
      - 'scripts/package-files.mjs'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Package • ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            script: build:macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            script: build:windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-packages-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - name: Windows writer conformance
        if: runner.os == 'Windows'
        run: cargo test --locked -p converter-core --test mdict_conformance
      - name: Windows checkpoint recovery
        if: runner.os == 'Windows'
        run: cargo test --locked -p converter-download --test checkpoint_recovery
      - name: Windows desktop publication
        if: runner.os == 'Windows'
        run: cargo test --locked -p converter-app --test desktop_storage
      # Версия уже подготовлена локальной сборкой и закоммичена для всего выпуска.
      - name: Build macOS Apple Silicon
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run ${{ matrix.script }} -- --reuse-version
      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 target/${{ matrix.target }}/release/bundle/macos/Converter.app
      - name: Build Windows x64
        if: runner.os == 'Windows'
        run: npm run ${{ matrix.script }} -- --reuse-version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Converter-${{ matrix.target }}-${{ github.sha }}
          path: .work/packages/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
